name: node.js test

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'


      - name: build-and-execute-server+test
        run: |
          ls -la
          npm install
          npm test
