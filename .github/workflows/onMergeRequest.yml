name: node.js test

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-run-server:
    runs-on: ubuntu-latest
    steps:
      - name: pull
        uses: actions/checkout@v2
        with:
          repository: mind4yottadb/mind-demo-server
          ref: main
          path: mind-demo-server
          clean: false


      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm install
      - run: npm test
